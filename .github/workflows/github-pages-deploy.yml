---
name: GitHub Pages Deploy
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  # Queue Pages deployments; never cancel an in-flight deploy. Cancelling mid-
  # deploy leaves the Pages backend with a superseded deployment and the next
  # run fails with "Deployment failed, try again later" (see actions/deploy-pages).
  cancel-in-progress: false

jobs:
  docs:
    uses: f5-sales-demo/docs-control/.github/workflows/github-pages-deploy.yml@ef85630aee69f170da1b20f3ded4c759e88860b2
    with:
      socketless_runner_label: docs-socketless
      container_build_runner_label: docs-container-build
      content-ref: ${{ github.sha }}
      docs-base: /
      builder-image: ghcr.io/f5-sales-demo/docs-builder@sha256:da6902688d1e81f193adce79879eec52dfc3d19420be5d539c4f4224949e5093
    permissions:
      contents: read # read documentation sources
      packages: read # pull the fleet documentation builder image
      pages: write # publish the built Pages artifact
      id-token: write # authenticate the Pages deployment
